az aks maintenanceconfiguration create \
  --resource-group <ResourceGroupName> \
  --cluster-name <ClusterName> \
  --name planned-freeze-window \
  --config-file planned-freeze-window.yaml



apiVersion: maintenance.k8s.io/v1
kind: MaintenanceConfiguration
metadata:
  name: planned-freeze-window
spec:
  notBefore: "2024-12-18T00:01:00Z"  # Start of the freeze window
  notAfter: "2025-01-06T23:59:00Z"   # End of the freeze window
  timeInWeek:
  - days:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
    startTime: "00:00"              # Start time of the freeze each day
    duration: "PT24H"               # Full-day freeze (24 hours per day)

# YAML data

# Check if the maintenance configuration exists
EXISTING_CONFIG=$(az aks maintenanceconfiguration list \
  --resource-group <ResourceGroupName> \
  --cluster-name <ClusterName> \
  --query "[?name=='planned-freeze-window']" -o tsv)

if [ -z "$EXISTING_CONFIG" ]; then
  # Create the maintenance configuration if it does not exist
  echo "Creating the planned maintenance freeze window..."
  az aks maintenanceconfiguration create \
    --resource-group <ResourceGroupName> \
    --cluster-name <ClusterName> \
    --name planned-freeze-window \
    --config-file planned-freeze-window.yaml
else
  # Update the existing maintenance configuration
  echo "Updating the existing planned maintenance freeze window..."
  az aks maintenanceconfiguration update \
    --resource-group <ResourceGroupName> \
    --cluster-name <ClusterName> \
    --name planned-freeze-window \
    --config-file planned-freeze-window.yaml
fi

# Get the maintenance configuration
az aks maintenanceconfiguration show \
  --resource-group <ResourceGroupName> \
  --cluster-name <ClusterName> \
  --name planned-freeze-window

# Delete the maintenance configuration