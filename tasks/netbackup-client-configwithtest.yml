# configure_netbackup_client.yml
---
- name: Configure NetBackup Client
  hosts: all
  gather_facts: yes
  vars:
    # Define the expected configuration
    netbackup_config:
      SERVER:
        - nbudevtst.systems.uk.hsbc
        - gbl25062948.systems.uk.hsbc
        - gbl25062949.systems.uk.hsbc
      CLIENT_NAME:
        - "{{ ansible_fqdn }}"
      CONNECT_OPTIONS:
        - PREFERRED_NETWORK=192.168.1.0
      CLIENT_PORT_WINDOW:
        - "2800 2810"

  tasks:
    - name: Backup existing configuration
      command: dzdo sudo /usr/openv/netbackup/bin/nbgetconfig
      register: original_config
      changed_when: false

    - name: Save backup configuration
      copy:
        content: "{{ original_config.stdout }}"
        dest: "/tmp/nbconfig_backup_{{ ansible_date_time.iso8601 }}"
      changed_when: false

    - name: Create new configuration file
      template:
        src: client_config.j2
        dest: /tmp/new_nbconfig.tmp
      register: config_file

    - name: Apply new configuration
      command: dzdo sudo /usr/openv/netbackup/bin/nbsetconfig < /tmp/new_nbconfig.tmp
      when: config_file.changed

    - name: Verify new configuration
      command: dzdo sudo /usr/openv/netbackup/bin/nbgetconfig
      register: verify_config
      changed_when: false

    - name: Display configuration changes
      debug:
        msg: 
          - "Previous configuration:"
          - "{{ original_config.stdout_lines }}"
          - "New configuration:"
          - "{{ verify_config.stdout_lines }}"

    - name: Cleanup temporary files
      file:
        path: /tmp/new_nbconfig.tmp
        state: absent





# How to run:
# ansible-playbook configure_netbackup_client.yml --extra-vars "@custom_config.yml"

# Example custom_config.yml:
netbackup_config:
  SERVER:
    - nbudevtst.systems.uk.hsbc
    - gbl25062948.systems.uk.hsbc
    - gbl25062949.systems.uk.hsbc
  CLIENT_NAME:
    - "{{ ansible_fqdn }}"
  CONNECT_OPTIONS:
    - PREFERRED_NETWORK=192.168.1.0
  CLIENT_PORT_WINDOW:
    - "2800 2810"