# test_netbackup.yml - Quick test playbook
---
- hosts: localhost # For testing, you can run against localhost
  gather_facts: yes
  vars:
    test_config:
      server:
        - primary.netbackup.com
        - secondary.netbackup.com
        - secondary.netbackup.com
        - secondary.netbackup.com
      mediaserver:
        - media1.netbackup.com
        - media2.netbackup.com
      client_name: "{{ ansible_hostname }}"
      client_config:
        CONNECT_OPTIONS: PREFERRED_NETWORK=192.168.1.0
        CONNECT_TIMEOUT: 120
        CLIENT_PORT_WINDOW: 4800 5000
        CLIENT_READ_TIMEOUT: 300
      policy:
        - name: daily_backup
          type: Standard
          schedule: Incremental
        - name: weekly_backup
          type: MS-Windows
          schedule: Full
      paths:
        - BROWSE_DIRECTORY = /data
        - BROWSE_DIRECTORY = /apps
        - EXCLUDE = /tmp
        - EXCLUDE = /var/log
  tasks:
    - name: Create test directory
      file:
        path: /tmp/netbackup_test
        state: directory

    - name: Generate test configuration
      template:
        src: ../templates/extended_nbconfig.j2
        dest: /tmp/netbackup_test/test_config.txt

    - name: Display generated configuration
      command: cat /tmp/netbackup_test/test_config.txt
      register: config_content

    - name: Show configuration
      debug:
        msg: "{{ config_content.stdout_lines }}"
